<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox Quest — Slay Your Inbox Clutter & Procrastination</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      .font-arcade {
        font-family: 'Chakra Petch', sans-serif;
      }
      body {
        margin: 0;
        background-color: #070a12;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      /* Custom scanline overlay for subtle arcade feel */
      .arcade-scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0, 0, 0, 0.25) 50%,
          rgba(0, 0, 0, 0.25)
        );
        background-size: 100% 4px;
        pointer-events: none;
      }
      /* Custom glowing scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0d121f;
      }
      ::-webkit-scrollbar-thumb {
        background: #25334d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f2fe;
      }
    </style>
  </head>
  <body class="bg-[#070a12] text-slate-100 selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
